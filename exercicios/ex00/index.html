<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Equilibrado</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <!-- PRINCIPAL -->
    <section class="principal">
        <header class="header">
            <a href="#"><i class="bi bi-list"></i></a>
            <a href="#">Time Equilib...</a>
            <a href="#"><i class="bi bi-search"></i></a>
            <a href="#"><i onclick="sectionSortear()" class="bi bi-people-fill"></i></a>
            <a href="#"><i onclick="adicionar()" class="bi bi-person-fill-add"></i></a>
            <a href="#"><i class="bi bi-three-dots-vertical"></i></a>
        </header>
        <main class="main">
            <p><span id="numero-jogadores"></span> jogadores marcados</p>
            <table class="tab-list">
                <tr>
                    <td class="align-left"></td>
                    <td class="align-right">
                    </td>
                    <td class="align-right"></td>
                </tr>
            </table>
        </main>
    </section>

    <!-- CADASTRO DE JOGADORES -->
    <section class="jogadores">
    <header class="header">
            <a href="#"><i onclick="voltar()" class="bi bi-arrow-return-left"></i></a>
            <a href="#">Cadastrar Jogador</a>
            <a href="#"><i onclick="save()" class="bi bi-floppy-fill"></i></a>
        </header>
        <main class="jogador">
            <input class="jogador__input__name" type="text" placeholder="Digite o nome do jogador" name="jogador" id="ijogador">
            <div class="jogador__nivel">
                <p>Nivel</p>
                <div class="jogador__nivel__star">
                    <i class="bi bi-star-fill"></i>
                    <i class="bi bi-star-fill"></i>
                    <i class="bi bi-star-fill"></i>
                    <i class="bi bi-star"></i>
                    <i class="bi bi-star"></i>
                </div>
                <input class="jogador__input__check" type="checkbox" name="" id="">
                <label for="">Goleiro, Líbero, etc.</label>
                <i class="bi bi-person-arms-up"></i>
                <p id="retorno"></p>
            </div>
        </main>
    </section>

<!-- SORTEADOS -->

    <section class="sortear">
         <header class="header">
            <a href="#"><i onclick="voltar()" class="bi bi-arrow-return-left"></i></a>
            <a href="#">Todos os Grupos</a>
            <a href="#"><i class="bi bi-share-fill"></i></i></a>
            <a href="#"><i class="bi bi-three-dots-vertical"></i></a>
        </header>
        <div class="sortear__btn">
            <select name="grupos" id="igrupos">
                <option value="2">2 Jogadores por time</option>
                <option value="3">3 Jogadores por time</option>
                <option value="4">4 Jogadores por time</option>
                <option value="5">5 Jogadores por time</option>
                <option value="6">6 Jogadores por time</option>
                <option value="7">7 Jogadores por time</option>
                <option value="8">8 Jogadores por time</option>
                <option value="9">9 Jogadores por time</option>
                <option value="10">10 Jogadores por time</option>
                <option value="11">11 Jogadores por time</option>
            </select>
            <button onclick="sortear()" type="button">SORTEAR</button>
        </div>
        <div id="resultado-sorteado">
        </div>
    </section>
    <script src="js/script.js"></script>
</body>
</html>
